# SPA hosting for the local daily driver, on TWO listeners.
#
#   :80   → published as host :5174. The daily driver, unchanged and UNAUTHENTICATED.
#   :8080 → published as host :5175. What the Cloudflare tunnel points at, and the
#           only listener that demands HTTP Basic auth.
#
# WHY TWO. The tunnel makes this app reachable by anyone who has the URL, while the
# stack deliberately runs DEBUG=true — which keeps POST /auth/debug/token alive and
# makes the Discord allowlist admit everyone. That combination is correct on
# localhost and catastrophic on a public hostname: the door is unlocked, so the
# building needs one. Basic auth on :8080 is that door.
#
# It lives on a SECOND port rather than on :80 so that adding remote access costs
# the daily driver nothing — no password prompt at the desk, no change to a stack
# that has been up for days. Source IP cannot tell the two apart (cloudflared runs
# on the host, so its traffic arrives from the same Docker gateway address as a
# browser on the host), which is why the split is by port and not by `allow`/`deny`.
#
# Both listeners serve the same bundle and the same /_api proxy from
# nginx-common.conf, so they cannot drift.

server {
    listen 80;
    server_name _;

    # `off` — the daily driver is never prompted. Read by the /_api location in
    # the shared snippet, which is the one place the two listeners must differ.
    set $tunnel_realm off;

    include /etc/nginx/snippets/app-common.conf;
}

server {
    listen 8080;
    server_name _;

    # Covers the bundle, the assets and every route that is not /_api.
    auth_basic           "neurospect-learn";
    # Bind-mounted from the host by docker-compose.yml, never baked into the image
    # — a credential in an image layer outlives every attempt to rotate it.
    auth_basic_user_file /etc/nginx/.htpasswd;

    # The API's realm, applied by the shared snippet, which turns it off for a
    # request that already carries a Bearer. See the long note there.
    set $tunnel_realm "neurospect-learn";

    include /etc/nginx/snippets/app-common.conf;
}
