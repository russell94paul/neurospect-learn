# SPA hosting for the local daily driver.
#
# `public/_redirects` does this same job on Cloudflare Pages, but it is a
# Pages-specific file that nginx ignores — so the rule has to exist twice, once
# per host. Both say the same thing: React Router owns every path, so any URL
# that is not a real file must return index.html.
#
# Without it, a refresh on /journal or /drills/... 404s, and so does
# /auth/callback — i.e. the redirect back from Discord, the first thing a login
# does. That is why this is not cosmetic.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames are immutable; index.html must never be cached, or a
    # rebuilt bundle keeps loading the previous entry point.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
