# Everything both server blocks in nginx.conf serve. Included twice — once by the
# unauthenticated LAN/localhost listener on :80, once by the Basic-auth listener
# on :8080 that the Cloudflare tunnel points at — so the two can never drift.

root /usr/share/nginx/html;
index index.html;

# Evidence captures are PNGs of TradingView charts and EVIDENCE_MAX_BYTES is
# 12 MiB. nginx's default is 1m, which would 413 every upload that matters.
client_max_body_size 32m;

# Hashed asset filenames are immutable; index.html must never be cached, or a
# rebuilt bundle keeps loading the previous entry point.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

location = /index.html {
    add_header Cache-Control "no-store";
}

# The API, same-origin. This is what makes the bundle host-agnostic: VITE_API_URL
# is the relative `/_api`, so the SAME build works on localhost:5174, on a LAN
# IP, and behind whatever random trycloudflare.com hostname the quick tunnel
# hands out today. Absolute URLs would have to be rebaked on every tunnel restart
# AND added to the API's CORS_ORIGINS; same-origin needs neither.
#
# The API mounts routers at /auth/* and /api/*, so the whole origin is forwarded,
# not a hand-listed set of prefixes.
#
# Regex location + variable upstream on purpose: with a variable in proxy_pass
# nginx re-resolves through Docker's embedded DNS (127.0.0.11) instead of
# caching the api container's IP at startup — otherwise `docker compose up -d api`
# hands the container a new IP and this proxy 502s until the app is restarted too.
# The cost of the variable form is that nginx no longer strips the location
# prefix automatically, hence the explicit path below.
#
# ⚠ NAMED capture, not $1 — and this is a bug that has already been paid for
# (2026-08-20). Any regex evaluated by an `if` inside a location RESETS $1..$9,
# including the `if` below, and including when it does not match. With $1 the
# proxy silently sent every request upstream as `/`, which FastAPI answered with
# a perfectly plausible 404 `{"detail":"Not Found"}` — a proxy that looks routed
# and is not. $api_path is immune.
location ~ ^/_api/(?<api_path>.*)$ {
    # THE ONE SUBTLETY IN THIS WHOLE SETUP.
    #
    # Basic auth cannot simply cover the API the way it covers the bundle. Both
    # schemes live in the `Authorization` header, and a browser attaches its
    # cached Basic credential ONLY to requests that do not already carry that
    # header — so every API call the SPA makes (each one an explicit
    # `Authorization: Bearer <jwt>`) arrives WITHOUT the Basic credential and
    # nginx 401s it. The SPA reads 401 as "token expired", drops it and bounces to
    # /login, which cannot mint a new one either: a login loop, on every request.
    #
    # So: a request already presenting a Bearer skips the password and is judged
    # by FastAPI's JWT instead. Everything with no Bearer — the page load, the
    # assets, POST /auth/debug/token and the Discord exchange, i.e. every route by
    # which an account could be minted — still needs the password.
    #
    # What that concedes: an attacker who sends `Authorization: Bearer garbage`
    # reaches FastAPI and is refused there (401), so the API is probeable and
    # /openapi.json is readable from the tunnel. What it does NOT concede is a
    # session: minting requires the password, and JWT_SECRET is random.
    #
    # $tunnel_realm is set per-listener in nginx.conf — `off` on :80 so the desk
    # never sees a prompt, the realm name on :8080 so the tunnel always does.
    set $api_realm $tunnel_realm;
    if ($http_authorization ~* "^Bearer ") {
        set $api_realm off;
    }
    auth_basic           $api_realm;
    auth_basic_user_file /etc/nginx/.htpasswd;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream api:8000;
    proxy_pass http://$api_upstream/$api_path$is_args$args;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Strip the tunnel's Basic credential, keep the app's Bearer JWT — they share
    # one header. The browser attaches `Authorization: Basic …` automatically to
    # every same-origin request on the :8080 listener, and FastAPI would read that
    # as a malformed bearer token on any call the SPA makes before login. An
    # explicit Bearer set by the SPA's fetch takes precedence over the browser's
    # cached credential, so this only ever clears the Basic case.
    # (`if` inside a location is safe here: `set` is one of the two directives it
    # handles correctly.)
    set $fwd_auth $http_authorization;
    if ($http_authorization ~* "^Basic ") {
        set $fwd_auth "";
    }
    proxy_set_header Authorization $fwd_auth;
}

# React Router owns every path, so any URL that is not a real file returns
# index.html. Without it a refresh on /journal or /drills/... 404s.
# (`public/_redirects` does this same job on Cloudflare Pages — a Pages-specific
# file nginx ignores, which is why the rule has to exist in both places.)
location / {
    try_files $uri $uri/ /index.html;
}
